# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: kitlung1107/history-quest
  branch: main

site_url: https://kitlung1107.github.io/history-quest/
display_url: https://kitlung1107.github.io/history-quest/
logo_url: https://files.manuscdn.com/user_upload_by_module/session_file/310519663927088869/fQwdjGMwUojWUNVd.png
locale: zh_Hant
publish_mode: simple
media_folder: client/public/uploads
public_folder: /history-quest/uploads
media_libraries:
  all:
    max_file_size: 5242880

collections:
  - name: settings
    label: 網站與首頁設定
    editor: { preview: false }
    files:
      - name: site
        label: 網站與首頁區塊
        file: client/src/content/settings/site.json
        fields:
          - {
              label: 編輯檢查與備份,
              name: _tools,
              widget: editor-tools,
              kind: site,
              required: false,
            }
          - {
              label: 學生畫面預覽,
              name: _preview,
              widget: live-preview,
              kind: site,
              required: false,
            }
          - { label: 網站名稱, name: title, widget: string }
          - { label: 副標題, name: subtitle, widget: string }
          - { label: 英文名稱, name: englishTitle, widget: string }
          - { label: 網站標誌, name: logo, widget: image, choose_url: true }
          - { label: 首頁大圖, name: hero, widget: image, choose_url: true }
          - {
              label: 大圖取景調整,
              name: heroPosition,
              widget: image-position,
              source: hero,
              required: false,
            }
          - {
              label: 大圖文字描述,
              name: heroAlt,
              widget: string,
              hint: "供讀屏工具使用，簡單描述圖片內容。",
            }
          - { label: 學生報到區標題, name: studentHeading, widget: string }
          - { label: 首頁精選標題, name: featuredHeading, widget: string }
          - { label: 全部任務標題, name: allHeading, widget: string }
          - { label: 沒有任務時的提示, name: emptyMessage, widget: text }
          - {
              label: 顯示主題卡片,
              name: showTopicCards,
              widget: boolean,
              default: true,
            }
          - label: 首頁主題卡片
            name: topicCards
            widget: list
            required: false
            max: 6
            summary: "{{fields.title}}"
            hint: "拖動調整次序；卡片連到所選年級。年級隱藏後，對應卡片亦會隱藏。"
            fields:
              - { label: 卡片標題, name: title, widget: string }
              - { label: 簡介, name: caption, widget: string }
              - {
                  label: 圖示文字,
                  name: icon,
                  widget: string,
                  hint: "建議一個符號或 emoji。",
                }
              - {
                  label: 連結年級,
                  name: grade,
                  widget: select,
                  options: [1, 2, 3, 4, 5, 6],
                }
              - {
                  label: 色彩,
                  name: accent,
                  widget: select,
                  options: [teal, red, gold],
                  default: gold,
                }
              - {
                  label: 顯示此卡片,
                  name: visible,
                  widget: boolean,
                  default: true,
                }
          - {
              label: 顯示每日一問區塊,
              name: showDaily,
              widget: boolean,
              default: true,
            }
          - { label: 每日一問標題, name: dailyLabel, widget: string }
          - {
              label: 每日一問內容,
              name: dailyText,
              widget: text,
              hint: "首頁提示文字，不會自動每日輪換，也不會收集答案。",
            }
          - {
              label: 顯示學生積分及完成數,
              name: showStats,
              widget: boolean,
              default: true,
            }
          - { label: 鼓勵文字, name: encouragement, widget: string }
      - name: grades
        label: 年級顯示及排序
        file: client/src/content/settings/grades.json
        fields:
          - label: 年級
            name: grades
            widget: list
            allow_add: false
            min: 6
            max: 6
            summary: "{{fields.title}}"
            hint: "拖動調整選單次序；關閉年級會一併隱藏其課題、任務及首頁卡片。"
            fields:
              - { label: 年級編號, name: grade, widget: hidden }
              - { label: 顯示名稱, name: title, widget: string }
              - {
                  label: 顯示此年級,
                  name: visible,
                  widget: boolean,
                  default: true,
                }
  - name: topics
    label: 年級與課題
    label_singular: 課題
    folder: client/src/content/topics
    create: true
    delete: false
    extension: json
    format: json
    slug: "{{fields.id}}"
    identifier_field: title
    summary: "中{{grade}}｜{{title}}"
    sortable_fields: [grade, order, title]
    reorder: true
    view_groups:
      - { label: 按年級, field: grade }
    fields:
      - {
          label: 課題識別碼,
          name: id,
          widget: string,
          pattern:
            [
              "^[A-Za-z0-9_-]{3,80}$",
              "請使用 3 至 80 個英文字母、數字、底線或連字號",
            ],
          hint: "例如 cold-war。建立後請勿更改；改名只需修改下方課題名稱，避免任務失去連結。",
        }
      - { label: 課題名稱, name: title, widget: string }
      - {
          label: 所屬年級,
          name: grade,
          widget: select,
          options: [1, 2, 3, 4, 5, 6],
        }
      - {
          label: 顯示次序,
          name: order,
          widget: number,
          value_type: int,
          min: 0,
          default: 100,
        }
      - {
          label: 公開顯示,
          name: visible,
          widget: boolean,
          default: true,
          hint: "關閉會同時隱藏此課題的任務。使用隱藏保留舊教材。",
        }
  - name: tasks
    duplicate: true
    editor: { preview: false }
    label: 歷史任務
    label_singular: 歷史任務
    folder: client/src/content/tasks
    create: true
    delete: true
    extension: json
    format: hq-task-json
    slug: "{{fields.task_id}}"
    summary: "{{title}}｜{{task_id}}"
    thumbnail: cover.image
    sortable_fields: [publishing.order, title, task_id, topicId]
    view_filters:
      - { label: 首頁精選, field: publishing.featured, pattern: "true" }
      - { label: 未公開, field: publishing.visible, pattern: "false" }
      - { label: 已公開, field: publishing.visible, pattern: "true" }
      - { label: 文章, field: basics.type, pattern: article }
      - { label: 遊戲, field: basics.type, pattern: game }
      - { label: 測驗, field: basics.type, pattern: quiz }
    view_groups:
      - { label: 按課題, field: topicId }
      - { label: 按公開狀態, field: publishing.visible }
    fields:
      - {
          label: 編輯檢查與備份,
          name: _tools,
          widget: editor-tools,
          kind: tasks,
          required: false,
        }
      - {
          label: 學生畫面預覽,
          name: _preview,
          widget: live-preview,
          kind: tasks,
          required: false,
        }
      - {
          label: "task_id（不可重複）",
          name: task_id,
          widget: string,
          hint: "例如 S3_HK_Battle1941_Quiz；成績以此識別任務。新增／複製首次儲存會加入獨立後綴並隱藏。",
          pattern:
            ["^[A-Za-z0-9_-]{3,80}$", "只可使用英文字母、數字、底線及連字號"],
        }
      - { label: 標題, name: title, widget: string }
      - label: 所屬課題
        name: topicId
        widget: relation
        collection: topics
        value_field: id
        display_fields: ["中{{grade}}｜{{title}}"]
        search_fields: [title, id]
        hint: "任務年級由所屬課題決定；先到「年級與課題」建立課題。"
      - name: basics
        label: 基本資料
        widget: object
        collapsed: true
        fields:
          - { label: 卡片簡介, name: description, widget: text }
          - {
              label: 任務類型,
              name: type,
              widget: select,
              options:
                [
                  { label: 文章閱讀, value: article },
                  { label: 互動遊戲, value: game },
                  { label: 小測驗, value: quiz },
                ],
            }
          - { label: 漫畫標籤, name: label, widget: string, default: 學習任務 }
          - {
              label: 建議時間（分鐘）,
              name: duration,
              widget: number,
              min: 1,
              max: 180,
              value_type: int,
            }
          - {
              label: 難度（1–5 星）,
              name: difficulty,
              widget: number,
              min: 1,
              max: 5,
              value_type: int,
            }
          - {
              label: 功能色,
              name: accent,
              widget: select,
              options:
                [
                  { label: 青綠（閱讀／成功）, value: teal },
                  { label: 朱紅（挑戰／戰爭）, value: red },
                  { label: 芥末黃（考古／入門）, value: gold },
                ],
            }
      - name: cover
        label: 封面與取景
        widget: object
        collapsed: true
        fields:
          - {
              label: 封面圖片,
              name: image,
              widget: image,
              multiple: false,
              choose_url: true,
            }
          - {
              label: 封面取景調整,
              name: imagePosition,
              widget: image-position,
              source: cover.image,
              required: false,
            }
      - name: content
        label: 教材內容
        widget: object
        collapsed: true
        fields:
          - { label: 文章內容, name: article, widget: markdown, minimal: false }
          - {
              label: YouTube／Google Drive 影片連結,
              name: videoUrl,
              widget: string,
              required: false,
              hint: "支援 YouTube watch／youtu.be，以及 Google Drive file/d/.../view。",
            }
          - {
              label: HTML5／iframe 遊戲連結,
              name: gameUrl,
              widget: string,
              required: false,
              hint: "必須使用 HTTPS；請確認遊戲來源允許 iframe。",
            }
      - name: assessment
        label: 測驗題目
        widget: object
        collapsed: true
        fields:
          - label: 測驗題目
            name: questions
            widget: list
            min: 1
            max: 30
            summary: "{{fields.prompt}}（{{fields.points}} 分）"
            hint: "可混合選擇题及短答題；拖動調整題目次序。等待網站發佈完成後，重新載入教師工作室網頁，系統會同步題目版本並核算本次載入的未核算提交；頂部「重新整理」可重試。已有成績與評語不會重改，短答仍須手動評分。"
            types:
              - name: choice
                label: 選擇題
                widget: object
                fields:
                  - {
                      label: 題目識別碼,
                      name: id,
                      widget: string,
                      pattern:
                        [
                          "^[A-Za-z0-9_-]{1,40}$",
                          "只可使用英文字母、數字、底線或連字號",
                        ],
                      hint: "同一任務不可重複，例如 q1。",
                    }
                  - { label: 題目, name: prompt, widget: text }
                  - {
                      label: 分數,
                      name: points,
                      widget: number,
                      value_type: int,
                      min: 1,
                      max: 100,
                      default: 10,
                    }
                  - {
                      label: 選項,
                      name: options,
                      widget: list,
                      min: 2,
                      max: 6,
                      field: { label: 選項, name: option, widget: string },
                    }
                  - {
                      label: 正確答案序號（第一項填 0）,
                      name: answer,
                      widget: number,
                      min: 0,
                      max: 5,
                      value_type: int,
                      default: 0,
                    }
                  - { label: 答案解說, name: explanation, widget: text }
              - name: short
                label: 文字短答
                widget: object
                fields:
                  - {
                      label: 題目識別碼,
                      name: id,
                      widget: string,
                      pattern:
                        [
                          "^[A-Za-z0-9_-]{1,40}$",
                          "只可使用英文字母、數字、底線或連字號",
                        ],
                    }
                  - { label: 題目, name: prompt, widget: text }
                  - {
                      label: 分數,
                      name: points,
                      widget: number,
                      value_type: int,
                      min: 1,
                      max: 100,
                      default: 10,
                    }
                  - {
                      label: 答題提示及解說,
                      name: explanation,
                      widget: text,
                      hint: "學生交卷後可見；請勿在公開教材內放私人批改資料。",
                    }
      - name: publishing
        label: 發布設定
        widget: object
        collapsed: true
        fields:
          - {
              label: 公開顯示,
              name: visible,
              widget: boolean,
              default: false,
              hint: "關閉後從學生頁面隱藏；這不是私人存取權限，公開儲存庫仍可讀到內容。",
            }
          - {
              label: 首頁精選,
              name: featured,
              widget: boolean,
              default: false,
              hint: "開啟後會出現在首頁精選；仍須同時公開任務、課題及年級。",
            }
          - {
              label: 顯示次序,
              name: order,
              widget: number,
              value_type: int,
              min: 0,
              default: 100,
              hint: "數字越小越前；相同數字按標題排列。",
            }
  - name: assets
    label: 圖片素材目錄
    folder: client/src/content/assets
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{fields.id}}"
    media_folder: /client/public/uploads/library
    public_folder: /history-quest/uploads/library
    summary: "{{category}}｜{{title}}"
    sortable_fields: [category, title]
    view_groups:
      - { label: 按分類, field: category }
    fields:
      - {
          label: 素材識別碼,
          name: id,
          widget: string,
          pattern:
            ["^[A-Za-z0-9_-]{3,80}$", "請使用英文字母、數字、底線或連字號"],
        }
      - { label: 名稱, name: title, widget: string }
      - {
          label: 分類,
          name: category,
          widget: string,
          hint: "例如香港歷史、世界大戰、地圖。",
        }
      - { label: 圖片, name: image, widget: image, choose_url: true }
      - { label: 圖片描述, name: alt, widget: string }
      - { label: 來源及使用授權, name: credit, widget: text, required: false }
      - {
          label: 搜尋標籤,
          name: tags,
          widget: list,
          required: false,
          field: { label: 標籤, name: tag, widget: string },
        }
      - {
          label: 圖片品質與使用位置,
          name: _usage,
          widget: image-audit,
          source: image,
          required: false,
        }
